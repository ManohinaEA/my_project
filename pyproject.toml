[project]
name = "vd-games"
version = "0.1.0"
description = "Collection of console games"
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
VD-games = "scripts.VD_games:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["VD_games", "scripts"]
