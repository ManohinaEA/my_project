[project]
name = "vd-games"
version = "0.1.0"
description = "VD Games project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["prompt"]

[project.scripts]
VD-games = "vd_games.scripts.VD_games:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vd_games"]
